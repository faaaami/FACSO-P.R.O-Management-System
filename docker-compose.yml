# Production-style stack: PostgreSQL, Redis, API and web (nginx + SPA).
#
#   cp deploy/.env.example .env      # fill in every value
#   docker compose up -d --build
#
# The web container listens on port 8080 of the host. Put TLS in front of it.
# Uploaded documents live in the "storage" volume and the database in "pgdata":
# back both up (see deploy/backup.sh).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pro
      POSTGRES_USER: pro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pro -d pro"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  api:
    build:
      context: .
      dockerfile: PROManagementSystem/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: "true"
      ForwardedHeaders__Enabled: "true"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=pro;Username=pro;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET}
      App__FrontendBaseUrl: ${PUBLIC_URL:?set PUBLIC_URL}
      Cors__AllowedOrigins__0: ${PUBLIC_URL}
      Smtp__Host: ${SMTP_HOST:?set SMTP_HOST}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromAddress: ${SMTP_FROM:?set SMTP_FROM}
      Razorpay__KeyId: ${RAZORPAY_KEY_ID:?set RAZORPAY_KEY_ID}
      Razorpay__KeySecret: ${RAZORPAY_KEY_SECRET:?set RAZORPAY_KEY_SECRET}
      Razorpay__WebhookSecret: ${RAZORPAY_WEBHOOK_SECRET:?set RAZORPAY_WEBHOOK_SECRET}
      Storage__RootPath: /app/storage
      Extraction__Provider: ${EXTRACTION_PROVIDER:-Local}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - storage:/app/storage

  web:
    build:
      context: Frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  redisdata:
  storage:
