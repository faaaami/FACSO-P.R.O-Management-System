# Serves the SPA and proxies the API on the same origin, so the browser never
# needs CORS and VITE_API_BASE_URL can stay unset. Terminate TLS in front of
# this container (load balancer, Caddy, Cloudflare, Azure Container Apps ...).
#
# This file is an nginx image TEMPLATE: ${UPPER_CASE} names are filled from the
# container environment at start-up (see Frontend/Dockerfile for the defaults,
# which suit docker-compose). Lower-case $names are ordinary nginx variables.
#   API_UPSTREAM      where /api and /hubs are proxied to
#   API_HOST_HEADER   Host header sent upstream ($host keeps the public host;
#                     Azure Container Apps needs the API app's own name)
#   FORWARDED_PROTO   X-Forwarded-Proto sent upstream ($scheme, or https when
#                     TLS is terminated in front of this container)
#   CLIENT_IP         X-Client-IP sent upstream ($remote_addr, or $xff_last
#                     when a trusted proxy in front appends the client address)

# The last address in X-Forwarded-For: the one appended by the proxy directly
# in front of nginx. Only meaningful when that proxy is trusted.
map $http_x_forwarded_for $xff_last {
    "~(?<last>[^,\s]+)\s*$" $last;
    default                 $remote_addr;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_set_header Host ${API_HOST_HEADER};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${FORWARDED_PROTO};
        proxy_set_header X-Client-IP ${CLIENT_IP};
        proxy_read_timeout 180s;
    }

    location /hubs/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host ${API_HOST_HEADER};
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${FORWARDED_PROTO};
        proxy_set_header X-Client-IP ${CLIENT_IP};
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
